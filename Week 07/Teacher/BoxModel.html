<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .my-box {
            /* 1. Content */
            width: 200px;
            height: 100px;
            background-color: lightblue;

            /* 2. Padding (ระยะห่างภายใน) */
            padding: 20px;

            /* 3. Border (เส้นขอบ) */
            border: 5px solid black;

            /* 4. Margin (ระยะห่างภายนอก) */
            margin: 30px;
        }
    </style>
</head>

<body>
    <div class="my-box">
        นี่คือเนื้อหา Content
    </div>
</body>

</html>
