<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-container">
        <h2 class="form-title">สร้างบัญชีผู้ใช้</h2>
        <p class="form-subtitle">เข้าร่วมเป็นส่วนหนึ่งกับเราได้ฟรี!</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้</label>
                <input type="text" id="username" name="username" placeholder="กรอกชื่อผู้ใช้ของคุณ">
            </div>

            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" name="email" placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" name="password" placeholder="รหัสผ่านอย่างน้อย 8 ตัวอักษร">
            </div>

            <button type="submit" class="submit-btn">สมัครสมาชิก</button>
        </form>
    </div>
</body>
</html>
