<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form Reference</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">ตัวอย่างการใช้งานฟอร์ม Bootstrap 5 (เฉลยสมบูรณ์)</h2>
        
        <form>
            <!-- ช่องกรอกอีเมลพื้นฐาน -->
            <div class="mb-3">
                <label for="exampleEmail" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleEmail" placeholder="name@example.com">
                <div class="form-text">เราจะไม่เปิดเผยอีเมลของคุณให้ใครรู้</div>
            </div>

            <!-- Dropdown Select -->
            <div class="mb-3">
                <label for="exampleSelect" class="form-label">เลือกประเภท</label>
                <select class="form-select" id="exampleSelect">
                    <option selected>เปิดเมนูเพื่อเลือก</option>
                    <option value="1">ทั่วไป</option>
                    <option value="2">ด่วน</option>
                </select>
            </div>

            <!-- Input Group (รวมไอคอนกับช่องกรอก) -->
            <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control" placeholder="Username">
            </div>

            <!-- Floating Label -->
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Password</label>
            </div>

            <!-- Switch Checkbox -->
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="flexSwitchCheckChecked" checked>
                <label class="form-check-label" for="flexSwitchCheckChecked">รับการแจ้งเตือน</label>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
