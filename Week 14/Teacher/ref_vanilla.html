<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form (สำหรับฝึกหัด)</title>
    <!-- Bootstrap 5 CSS (นำเข้า CSS ของ Bootstrap จากอินเทอร์เน็ต) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- TODO 1: เพิ่มคลาสของ Bootstrap (container mt-5) จัดกล่องให้อยู่ตรงกลางและเว้นขอบซ้ายขวา -->
    <div>
        <!-- TODO: เพิ่มคลาส (mb-4) เพื่อเว้นระยะด้านล่างหัวข้อ -->
        <h2>ตัวอย่างฟอร์ม Bootstrap 5 (แบบฝึกหัด)</h2>
        
        <form>
            <!-- ช่องกรอกอีเมลพื้นฐาน -->
            <!-- TODO 2: เพิ่มคลาส Utility (mb-3) เว้นระยะห่างบรรทัดด้านล่าง 3 ระดับ -->
            <div>
                <!-- TODO 3: เพิ่มคลาสสำหรับป้ายกำกับ (form-label) -->
                <label for="exampleEmail">Email address</label>
                <!-- TODO 4: เพิ่มคลาสหัวใจสำคัญ! (form-control) ที่ทำให้ช่องกรอกกว้าง 100% มีขอบมน -->
                <input type="email" id="exampleEmail" placeholder="name@example.com">
                <!-- TODO: เพิ่มคลาส (form-text) สำหรับคำอธิบายตัวเล็ก -->
                <div>เราจะไม่เปิดเผยอีเมลของคุณให้ใครรู้</div>
            </div>

            <!-- Dropdown Select -->
            <!-- TODO: เพิ่มคลาส (mb-3) -->
            <div>
                <!-- TODO: เพิ่มคลาส (form-label) -->
                <label for="exampleSelect">เลือกประเภท</label>
                <!-- TODO 5: เพิ่มคลาสเฉพาะสำหรับช่องเลือก Dropdown (form-select) -->
                <select id="exampleSelect">
                    <option selected>เปิดเมนูเพื่อเลือก</option>
                    <option value="1">ทั่วไป</option>
                    <option value="2">ด่วน</option>
                </select>
            </div>

            <!-- Input Group (รวมไอคอนกับช่องกรอก) -->
            <!-- TODO 6: เพิ่มคลาสสำหรับจัดกลุ่มไอคอน (input-group mb-3) ให้แนบติดกับช่องกรอกข้อความ -->
            <div>
                <!-- TODO: เพิ่มคลาส (input-group-text) เพื่อสร้างพื้นหลังให้ไอคอน -->
                <span>@</span>
                <!-- TODO: เพิ่มคลาส (form-control) -->
                <input type="text" placeholder="Username">
            </div>

            <!-- Floating Label -->
            <!-- TODO 7: เพิ่มคลาส (form-floating mb-3) สำหรับสร้างเอฟเฟกต์ป้ายกำกับลอยขึ้น -->
            <div>
                <!-- TODO: เพิ่มคลาส (form-control) -->
                <input type="password" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Password</label>
            </div>

            <!-- Switch Checkbox -->
            <!-- TODO: เพิ่มคลาส (form-check form-switch mb-3) เพื่อทำเป็น Switch -->
            <div>
                <!-- TODO 8: เพิ่มคลาสสำหรับตัวกล่อง Checkbox (form-check-input) -->
                <input type="checkbox" id="flexSwitchCheckChecked" checked>
                <!-- TODO 9: เพิ่มคลาสสำหรับป้ายกำกับข้อความของ Checkbox (form-check-label) -->
                <label for="flexSwitchCheckChecked">รับการแจ้งเตือน</label>
            </div>

            <!-- TODO 10: เพิ่มคลาส 2 ตัว (btn btn-primary) 1) ทำปุ่มพื้นฐาน 2) เปลี่ยนปุ่มเป็นสีน้ำเงินหลัก -->
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
