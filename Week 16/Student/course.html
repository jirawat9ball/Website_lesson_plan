<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Platform - Course (รายละเอียดคอร์ส)</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================================
         Shared Header (ดึงมาจาก components.js จุดเดียวทุกหน้า)
         ======================================================== -->
    <site-header active="course.html"></site-header>

    <!-- ========================================================
         Main Content (หน้ารายละเอียดคอร์ส)
         ======================================================== -->
    <main class="py-5">
        <div class="container py-lg-4">
            <!-- 1. Course Showcase Details -->
            <div class="row g-5 mb-5 pb-4 align-items-start">
                <!-- ฝั่งซ้าย: รูปพรีวิวและปุ่มหัวใจ (ภาพฟรี Unsplash) -->
                <div class="col-lg-6">
                    <div class="preview-wrapper">
                        <button type="button" class="fav-btn" title="Save to favorites">
                            <i class="bi bi-heart"></i>
                        </button>
                        <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1000&q=80" 
                             alt="Web Design Course Preview" 
                             class="img-fluid w-100" 
                             style="max-height: 480px; object-fit: cover;">
                    </div>
                </div>

                <!-- ฝั่งขวา: ข้อมูลคอร์ส, ตัวเลือก และฟอร์มสั่งซื้อ -->
                <div class="col-lg-6">
                    <h1 class="fw-bold text-dark fs-2 mb-2">Web Design Course</h1>
                    <span class="badge-tag mb-3">Tag</span>

                    <div class="my-3">
                        <span class="fs-3 fw-bold text-dark align-top">฿</span>
                        <span class="display-5 fw-bold text-dark">4,000</span>
                        <span class="fs-4 fw-medium text-dark ms-1">บาท</span>
                    </div>

                    <p class="text-secondary mb-4">Text</p>

                    <!-- Form Select Row -->
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label small text-muted fw-semibold">Label</label>
                            <select class="form-select form-select-lg fs-6 py-2">
                                <option selected>Value</option>
                                <option value="1">Option 1</option>
                                <option value="2">Option 2</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-muted fw-semibold">Label</label>
                            <select class="form-select form-select-lg fs-6 py-2">
                                <option selected>Value</option>
                                <option value="1">Option 1</option>
                                <option value="2">Option 2</option>
                            </select>
                        </div>
                    </div>

                    <!-- ปุ่ม Add to cart เต็มความกว้าง -->
                    <button class="btn btn-primary w-100 py-3 fw-semibold fs-5 rounded-3 mb-4 shadow-sm">
                        Add to cart
                    </button>

                    <!-- Accordion FAQ แบบพับได้ -->
                    <div class="accordion border rounded-3 overflow-hidden" id="courseAccordion">
                        <div class="accordion-item border-0">
                            <h2 class="accordion-header" id="headingOne">
                                <button class="accordion-button fw-bold text-dark shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                    Title
                                </button>
                            </h2>
                            <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#courseAccordion">
                                <div class="accordion-body text-secondary pt-0">
                                    Answer the frequently asked question in a simple sentence, a longish paragraph, or even in a list.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Course Grid Section (3 ใบด้านล่าง) -->
            <div class="pt-4">
                <h2 class="fw-bold text-primary display-6 mb-4">Course</h2>
                
                <div class="row g-4">
                    <!-- Course 1 -->
                    <div class="col-md-4">
                        <div class="course-card h-100">
                            <img src="https://images.unsplash.com/photo-1593508512255-86ab42a8e620?auto=format&fit=crop&w=600&q=80" 
                                 alt="VR Crusoe">
                            <div class="card-body">
                                <h5 class="card-title">VR Crusoe</h5>
                                <div class="price text-primary fs-5">$35</div>
                                <p class="card-text text-secondary mb-0">Body text.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Course 2 -->
                    <div class="col-md-4">
                        <div class="course-card h-100">
                            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80" 
                                 alt="3D Crusoe">
                            <div class="card-body">
                                <h5 class="card-title">3D Crusoe</h5>
                                <div class="price text-primary fs-5">$25</div>
                                <p class="card-text text-secondary mb-0">Body text.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Course 3 -->
                    <div class="col-md-4">
                        <div class="course-card h-100">
                            <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=600&q=80" 
                                 alt="Programming Crusoe">
                            <div class="card-body">
                                <h5 class="card-title">Programming Crusoe</h5>
                                <div class="price text-primary fs-5">$30</div>
                                <p class="card-text text-secondary mb-0">Body text.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ========================================================
         Shared Footer (ดึงมาจาก components.js จุดเดียวทุกหน้า)
         ======================================================== -->
    <site-footer></site-footer>

    <!-- Bootstrap 5 JS Bundle & Shared Components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components.js"></script>
</body>
</html>
