<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Platform - Home (หน้าแรก)</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================================
         Shared Header (ดึงมาจาก components.js จุดเดียวทุกหน้า)
         ======================================================== -->
    <!-- สเต็ปที่ 1.1: เรียกใช้ Shared Header (<site-header></site-header>) -->

    <!-- ========================================================
         Main Content (หน้าแรก Index)
         ======================================================== -->
    <main>
        <!-- 1. Hero Section -->
        <section class="py-5">
            <div class="container py-lg-4">
                <div class="row align-items-center g-5">
                    <!-- Hero Left: Image (ภาพนักเรียนจากแหล่งภาพฟรี Unsplash) -->
                    <div class="col-lg-6">
                        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=80" 
                             alt="Young student studying" 
                             class="img-fluid rounded-4 shadow">
                    </div>

                    <!-- Hero Right: Text & Call to Actions -->
                    <div class="col-lg-6">
                        <span class="hero-spaced-tag">a b o u t &nbsp; u s</span>
                        <h1 class="display-4 fw-bold mb-4 lh-sm text-dark">
                            We are the top<br>Program Learning<br>Platform
                        </h1>
                        <div class="d-flex gap-3">
                            <!-- สเต็ปที่ 2.1: เชื่อมปุ่ม Buy now ไปหน้าคอร์ส (ใส่ href="course.html") -->
                            <a href="#" class="btn btn-primary px-4 py-2 fw-semibold">Buy now</a>
                            <a href="#about" class="btn btn-dark px-4 py-2 fw-semibold">Show more</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. Promo & Classroom Banner Section -->
        <section class="py-5 bg-white text-center">
            <div class="container py-lg-3">
                <h2 class="fw-bold mb-2 fs-1 text-dark">เปลี่ยนไอเดียให้เป็นผลงาน</h2>
                <p class="fs-5 text-secondary mb-2">เรียนรู้จากการลงมือทำจริงก้าวสู่</p>
                <div class="banner-title-big mb-4">มืออาชีพ</div>

                <!-- ภาพห้องเรียนและการสอน (ภาพฟรี Unsplash) -->
                <div class="row justify-content-center">
                    <div class="col-12">
                        <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=1200&q=80" 
                             alt="Classroom interactive learning" 
                             class="img-fluid rounded-4 shadow-sm w-100" 
                             style="max-height: 480px; object-fit: cover;">
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. Course Section (Grid 3 ใบ) -->
        <section class="py-5">
            <div class="container py-lg-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-primary display-6 mb-0">Course</h2>
                    <!-- สเต็ปที่ 2.2: เชื่อมปุ่ม more ไปหน้าคอร์ส (ใส่ href="course.html") -->
                    <a href="#" class="btn btn-dark rounded-pill px-3 py-1 small">more</a>
                </div>

                <div class="row g-4">
                    <!-- Course 1: VR Crusoe -->
                    <div class="col-md-4">
                        <div class="course-card h-100">
                            <img src="https://images.unsplash.com/photo-1593508512255-86ab42a8e620?auto=format&fit=crop&w=600&q=80" 
                                 alt="VR Crusoe Course">
                            <div class="card-body">
                                <h5 class="card-title">VR Crusoe</h5>
                                <div class="price text-primary fs-5">$35</div>
                                <p class="card-text text-secondary mb-0">Body text.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Course 2: 3D Crusoe -->
                    <div class="col-md-4">
                        <div class="course-card h-100">
                            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80" 
                                 alt="3D Crusoe Course">
                            <div class="card-body">
                                <h5 class="card-title">3D Crusoe</h5>
                                <div class="price text-primary fs-5">$25</div>
                                <p class="card-text text-secondary mb-0">Body text.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Course 3: Programming Crusoe -->
                    <div class="col-md-4">
                        <div class="course-card h-100">
                            <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=600&q=80" 
                                 alt="Programming Crusoe Course">
                            <div class="card-body">
                                <h5 class="card-title">Programming Crusoe</h5>
                                <div class="price text-primary fs-5">$30</div>
                                <p class="card-text text-secondary mb-0">Body text.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ========================================================
         Shared Footer (ดึงมาจาก components.js จุดเดียวทุกหน้า)
         ======================================================== -->
    <!-- สเต็ปที่ 1.2: เรียกใช้ Shared Footer (<site-footer></site-footer>) -->

    <!-- Bootstrap 5 JS Bundle & Shared Components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components.js"></script>
</body>
</html>
