<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Platform - Instructors (ข้อมูลผู้สอน)</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Devicon (ไอคอนโปรแกรมเครื่องมือต่างๆ) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================================
         Shared Header (ดึงมาจาก components.js จุดเดียวทุกหน้า)
         ======================================================== -->
    <site-header active="instructors.html"></site-header>

    <!-- ========================================================
         Main Content (หน้าโปรไฟล์ผู้สอน)
         ======================================================== -->
    <main class="py-5">
        <div class="container py-lg-5">
            <div class="row align-items-center g-5">
                <!-- ฝั่งซ้าย: ภาพถ่ายโปรไฟล์ทรงกลม (ภาพขาว-ดำตามต้นแบบ) -->
                <div class="col-lg-5 text-center">
                    <img src="image/Profile.png" 
                         onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80';"
                         alt="อาจารย์ จิรวัฒน์ เตชะปรีชาวงศ์" 
                         class="instructor-avatar img-fluid">
                </div>

                <!-- ฝั่งขวา: ข้อมูลผู้สอน, โปรแกรม และผลงาน -->
                <div class="col-lg-7">
                    <h1 class="display-4 fw-bold text-primary mb-3 lh-1">
                        Jirawat<br>Tachaprechawong
                    </h1>

                    <p class="fs-5 text-dark fw-normal mb-4 pe-lg-4">
                        "สอนด้วยความเข้าใจ ใส่ใจทุกรายละเอียด พร้อมปูพื้นฐานให้แน่นและต่อยอดได้ในเวลาอันสั้น"
                    </p>

                    <!-- 1. Program Tools Section -->
                    <div class="mb-4">
                        <h6 class="fw-bold text-dark fs-5 mb-3">program</h6>
                        <div class="d-flex flex-wrap gap-3">
                            <!-- แถวที่ 1 -->
                            <div class="tech-icon-box" title="Visual Studio Code"><i class="devicon-vscode-plain colored"></i></div>
                            <div class="tech-icon-box" title="Unity"><i class="devicon-unity-original"></i></div>
                            <div class="tech-icon-box" title="C#"><i class="devicon-csharp-plain colored"></i></div>
                            <div class="tech-icon-box" title="JavaScript"><i class="devicon-javascript-plain colored"></i></div>
                            <div class="tech-icon-box" title="HTML5"><i class="devicon-html5-plain colored"></i></div>
                            <div class="tech-icon-box" title="CSS3"><i class="devicon-css3-plain colored"></i></div>

                            <!-- แถวที่ 2 -->
                            <div class="tech-icon-box" title="Figma"><i class="devicon-figma-plain colored"></i></div>
                            <div class="tech-icon-box" title="Photoshop"><i class="devicon-photoshop-plain colored"></i></div>
                            <div class="tech-icon-box" title="Illustrator"><i class="devicon-illustrator-plain colored"></i></div>
                            <div class="tech-icon-box" title="Premiere Pro"><i class="devicon-premierepro-plain colored"></i></div>
                            <div class="tech-icon-box" title="After Effects"><i class="devicon-aftereffects-plain colored"></i></div>
                            <div class="tech-icon-box" title="GitHub"><i class="devicon-github-original"></i></div>
                        </div>
                    </div>

                    <!-- 2. Product Showcase Section -->
                    <div>
                        <h6 class="fw-bold text-dark fs-5 mb-2">product</h6>
                        <p class="fs-5 text-dark fw-normal mb-0">web game paint vdo</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ========================================================
         Shared Footer (ดึงมาจาก components.js จุดเดียวทุกหน้า)
         ======================================================== -->
    <site-footer></site-footer>

    <!-- Bootstrap 5 JS Bundle & Shared Components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components.js"></script>
</body>
</html>
